[build]
  command = "npm install && npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/.netlify/functions/app"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/.netlify/functions/app"
  status = 200
  force = true
